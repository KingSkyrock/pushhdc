[project]
name = "pushhdc"
version = "0.1.0"
description = "Evolving HDC encoders with genetic programming"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/pushhdc/pyshgp/LICENSE"]
authors = [
    { name = "Luke Wang", email = "lukewang74@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1.0",
    "pyrsistent>=0.20.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "mypy>=2.4.0",
    "pytest>=9",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["-ra"]
strict = true
testpaths = ["tests"]
markers = [
    "slow: long-running tests like evolution runs (deselect with -m 'not slow')",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["^src/pushhdc/pyshgp/", "^tests/pyshgp/"]

[[tool.mypy.overrides]]
module = ["pushhdc.pyshgp.*"]
follow_imports = "skip"

[tool.importlinter]
root_package = "pushhdc"

[[tool.importlinter.contracts]]
name = "Layers, from the search and scoring down to the vendored pyshgp"
type = "layers"
containers = ["pushhdc"]
layers = [
    "choice | evolution | evaluation",
    "clearing | dedup | parallel | encoder_ops",
    "push_hdc | units | recording",
    "instructions | inputs | levels",
    "hypervector | fitness",
    "kernel",
    "pyshgp",
]

[[tool.importlinter.contracts]]
name = "The search knows nothing about hvs or Push instructions"
type = "forbidden"
source_modules = [
    "pushhdc.choice",
    "pushhdc.evolution",
    "pushhdc.clearing",
    "pushhdc.dedup",
    "pushhdc.parallel",
    "pushhdc.fitness",
    "pushhdc.kernel",
]
forbidden_modules = [
    "pushhdc.evaluation",
    "pushhdc.encoder_ops",
    "pushhdc.push_hdc",
    "pushhdc.units",
    "pushhdc.recording",
    "pushhdc.instructions",
    "pushhdc.inputs",
    "pushhdc.levels",
    "pushhdc.hypervector",
]

[[tool.importlinter.contracts]]
name = "Scoring knows nothing about the search"
type = "forbidden"
source_modules = [
    "pushhdc.evaluation",
    "pushhdc.encoder_ops",
    "pushhdc.push_hdc",
    "pushhdc.units",
    "pushhdc.recording",
    "pushhdc.instructions",
    "pushhdc.inputs",
    "pushhdc.levels",
    "pushhdc.hypervector",
]
forbidden_modules = [
    "pushhdc.choice",
    "pushhdc.evolution",
    "pushhdc.clearing",
    "pushhdc.dedup",
    "pushhdc.parallel",
]
