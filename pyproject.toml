[project]
name = "pushhdc"
version = "0.1.0"
description = "Evolving HDC encoders with genetic programming"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Luke Wang", email = "lukewang74@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["-ra"]
strict = true
testpaths = ["tests"]
markers = [
    "slow: long-running tests like evolution runs (deselect with -m 'not slow')",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
